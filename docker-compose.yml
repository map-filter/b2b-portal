name: b2b

x-core: &core
  build:
    context: .
    dockerfile: infra/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: ${IMAGE_PREFIX:-b2b}-core:dev
  environment:
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: ${APP_URL:-http://127.0.0.1:8201}
    DEMO_RESET: ${DEMO_RESET:-false}
    INTEGRATION_TOKEN: ${INTEGRATION_TOKEN:?заполните .env по .env.example}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    B24_WEBHOOK_URL: ${B24_WEBHOOK_URL:-}
    KASPI_API_URL: ${KASPI_API_URL:-http://kaspi-emu:8080/shop/api}
    KASPI_API_TOKEN: ${KASPI_API_TOKEN:-demo-kaspi-token}
    KASPI_PRICELIST_TOKEN: ${KASPI_PRICELIST_TOKEN:-demo-pricelist}
    KASPI_MODE: ${KASPI_MODE:-one_c}
  volumes:
    - ./core-laravel:/var/www/core
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    rabbitmq:
      condition: service_healthy

services:
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${PORT_GATEWAY:-8201}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./core-laravel/public:/var/www/core/public:ro
    depends_on: [core, client, manager, exchange]

  core:
    <<: *core

  queue:
    <<: *core
    command: php artisan queue:work --tries=3 --backoff=10
    restart: unless-stopped

  scheduler:
    <<: *core
    command: php artisan schedule:work
    restart: unless-stopped

  consumer:
    <<: *core
    command: php artisan exchange:consume
    restart: unless-stopped

  client:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./client-react:/app
    environment:
      VITE_HMR_PORT: ${PORT_GATEWAY:-8201}
    ports:
      - "127.0.0.1:${PORT_CLIENT:-8202}:5173"

  manager:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./manager-vue:/app
    environment:
      VITE_HMR_PORT: ${PORT_GATEWAY:-8201}
    ports:
      - "127.0.0.1:${PORT_MANAGER:-8203}:5173"

  web:
    profiles: [demo]
    build:
      context: .
      dockerfile: infra/web/Dockerfile
      args:
        VITE_APP_BASE: ${PUBLIC_BASE:-/}
    image: ${IMAGE_PREFIX:-b2b}-web:demo
    volumes:
      - ./core-laravel/public:/var/www/core/public:ro
    ports:
      - "127.0.0.1:${PORT_WEB:-8208}:80"
    restart: unless-stopped
    depends_on: [core]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: b2b
      POSTGRES_USER: b2b
      POSTGRES_PASSWORD: b2b
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${PORT_POSTGRES:-8204}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2b -d b2b"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: b2b
      RABBITMQ_DEFAULT_PASS: b2b
    ports:
      - "127.0.0.1:${PORT_RABBIT_UI:-8205}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${PORT_MAIL:-8206}:8025"

  exchange:
    build: ./exchange-go
    image: ${IMAGE_PREFIX:-b2b}-exchange:dev
    environment:
      RABBITMQ_URL: amqp://b2b:b2b@rabbitmq:5672/
      EXCHANGE_LOGIN: ${EXCHANGE_LOGIN:-1c}
      EXCHANGE_PASSWORD: ${EXCHANGE_PASSWORD:-demo1c}
      EXCHANGE_UPLOAD_DIR: /data
    volumes:
      - exchange-data:/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT_EXCHANGE:-8207}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  kaspi-emu:
    build: ./kaspi-emu
    image: ${IMAGE_PREFIX:-b2b}-kaspi-emu:dev
    environment:
      KASPI_EMU_TOKEN: ${KASPI_API_TOKEN:-demo-kaspi-token}
      KASPI_EMU_PUBLIC_URL: http://kaspi-emu:8080
      KASPI_EMU_PRICELIST_URL: ${KASPI_EMU_PRICELIST_URL:-http://nginx/api/kaspi/pricelist/${KASPI_PRICELIST_TOKEN:-demo-pricelist}.xml}
      KASPI_EMU_NEW_ORDER_EVERY: ${KASPI_EMU_NEW_ORDER_EVERY:-4m}
    volumes:
      - kaspi-data:/data
    ports:
      - "127.0.0.1:${PORT_KASPI:-8209}:8080"
    restart: unless-stopped

  bot:
    profiles: [bot]
    build: ./bot-python
    image: ${IMAGE_PREFIX:-b2b}-bot:dev
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORTAL_URL: http://nginx
      CABINET_URL: ${CABINET_URL:-http://127.0.0.1:8201}
      RABBITMQ_URL: amqp://b2b:b2b@rabbitmq:5672/
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  exchange-data:
  kaspi-data:
