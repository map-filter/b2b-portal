name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-laravel
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: b2b_test
          POSTGRES_USER: b2b
          POSTGRES_PASSWORD: b2b
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U b2b" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: b2b_test
      DB_USERNAME: b2b
      DB_PASSWORD: b2b
      REDIS_HOST: 127.0.0.1
      RABBITMQ_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, zip, gd, bcmath, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-react
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager-vue
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run format:check
      - run: npm run build

  exchange:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exchange-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: exchange-go/go.sum
      - run: go vet ./...
      - run: go test ./...

  kaspi-emu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kaspi-emu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: false
      - run: go vet ./...
      - run: go test ./...

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
